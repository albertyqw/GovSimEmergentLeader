name: fishing_${code_version}/${group_name}
scenario: fishing
debug: false
seed: 0
phases:
- harvesting
- discussion
- reflection
defaults:
- persona@personas.persona_0: baseline_fisherman
- persona@personas.persona_1: baseline_fisherman
- persona@personas.persona_2: baseline_fisherman
- persona@personas.persona_3: baseline_fisherman
- persona@personas.persona_4: baseline_fisherman
- persona@personas.persona_5: baseline_fisherman
- persona@personas.persona_6: baseline_fisherman
- persona@personas.persona_7: baseline_fisherman
- persona@personas.persona_8: baseline_fisherman
- persona@personas.persona_9: baseline_fisherman
- persona@personas.persona_10: baseline_fisherman
- persona@personas.persona_11: baseline_fisherman
env:
  name: fish_baseline_concurrent
  class_name: fishing_perturbation_concurrent_env
  max_num_rounds: 6
  initial_resource_in_pool: 100
  poupulation_change_after_round: double_100_cap
  observation_other_agents_harvesting: true
  language_nature: unconstrained
  num_agents: 8
  disinformation: false
  harvesting_order: concurrent
  assign_resource_strategy: stochastic
  inject_universalization: false
  inject_scenario_dynamic: false
  regen_factor_range:
  - 1.0
  - 3.0
  perturbations: []
  paper_definitions: true
  collapse_threshold: 5
personas:
  num: 8
  persona_0:
    name: Julia
  persona_1:
    name: Kate
  persona_2:
    name: Jack
  persona_3:
    name: Emma
  persona_4:
    name: Luke
  persona_5:
    name: Noah
  persona_6:
    name: Olivia
  persona_7:
    name: Liam
  persona_8:
    name: Sophia
  persona_9:
    name: Mason
  persona_10:
    name: Ava
  persona_11:
    name: Ethan
agent:
  agent_package: persona_v3
  system_prompt: v3
  cot_prompt: think_step_by_step
  leader_population: none
  act:
    universalization_prompt: false
    harvest_strategy: one_step
    consider_identity_persona: true
    drop_mayor_line: false
  converse:
    inject_resource_observation: ${experiment.env.observation_other_agents_harvesting}
    inject_resource_observation_strategy: manager
    max_conversation_steps: 50
    prompt_utterance: one_shot
    neutral_announcer: false
    drop_truthfulness_line: false
    seeded_opener: false
    elicitation: false
    perceived_leadership: false
  store:
    expiration_delta:
      days: 63
  values_plan: false
  stakes_tenure: false
  lake_scale: 1
  paper_definitions: true
  study_generation_max_tokens: 16000
  neutral_study: true
